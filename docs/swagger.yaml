basePath: /v1
definitions:
  Comment:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      postId:
        type: integer
      user:
        $ref: '#/definitions/User'
      userId:
        type: integer
    type: object
  CreatePostPayload:
    properties:
      content:
        maxLength: 1000
        minLength: 20
        type: string
      tags:
        items:
          type: string
        maxItems: 10
        minItems: 1
        type: array
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - content
    - tags
    - title
    type: object
  CreateUserPayload:
    properties:
      email:
        type: string
      password:
        maxLength: 20
        minLength: 6
        type: string
      username:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - email
    - password
    - username
    type: object
  Envelope:
    properties:
      data: {}
    type: object
  ErrorResponse:
    properties:
      errorCode:
        example: BAD_REQUEST
        type: string
      message:
        example: invalid user ID format
        type: string
      status:
        example: 400
        type: integer
    type: object
  FollowUser:
    properties:
      user_id:
        type: integer
    type: object
  Post:
    properties:
      comments:
        items:
          $ref: '#/definitions/Comment'
        type: array
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/User'
      userId:
        type: integer
      version:
        type: integer
    type: object
  PostWithMetaData:
    properties:
      comments:
        items:
          $ref: '#/definitions/Comment'
        type: array
      comments_count:
        type: integer
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/User'
      userId:
        type: integer
      version:
        type: integer
    type: object
  UpdatePostPayload:
    properties:
      content:
        maxLength: 1000
        minLength: 20
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: Boris KAMTOU
    url: https://linkedin.com/in/boriskamtou
  description: A social media API built with Go, Chi and PostgreSQL.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Social Media API
  version: "1.0"
paths:
  /health:
    get:
      description: Returns the status, environment and version of the API.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Service health
      tags:
      - ops
  /posts:
    post:
      consumes:
      - application/json
      parameters:
      - description: Post to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/CreatePostPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create a post
      tags:
      - posts
  /posts/{postID}:
    delete:
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Delete a post
      tags:
      - posts
    get:
      description: Returns the post along with its comments.
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Fetch a post
      tags:
      - posts
    patch:
      consumes:
      - application/json
      description: Only the fields present in the body are modified.
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/UpdatePostPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update a post
      tags:
      - posts
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/User'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Registers a new account. The password is never returned.
      parameters:
      - description: Account details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/CreateUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create a user
      tags:
      - users
  /users/{userID}:
    get:
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Fetch a user
      tags:
      - users
  /users/{userID}/follow:
    put:
      consumes:
      - application/json
      description: The user in the path starts following the user in the body.
      parameters:
      - description: Follower user ID
        in: path
        name: userID
        required: true
        type: integer
      - description: User to follow
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/FollowUser'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Follow a user
      tags:
      - users
  /users/{userID}/unfollow:
    put:
      consumes:
      - application/json
      parameters:
      - description: Follower user ID
        in: path
        name: userID
        required: true
        type: integer
      - description: User to unfollow
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/FollowUser'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Unfollow a user
      tags:
      - users
  /users/feed:
    get:
      description: Posts from the accounts the user follows, with their comment count.
      parameters:
      - default: 20
        description: Page size, 1 to 20
        in: query
        name: limit
        type: integer
      - default: 0
        description: Rows to skip
        in: query
        name: offset
        type: integer
      - default: desc
        description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - collectionFormat: csv
        description: Filter by tags, up to 5
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: Full text search on title and content
        in: query
        name: search
        type: string
      - description: Lower bound date, YYYY-MM-DD
        in: query
        name: since
        type: string
      - description: Upper bound date, YYYY-MM-DD
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/PostWithMetaData'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: User feed
      tags:
      - feed
securityDefinitions:
  BearerAuth:
    description: Paste the accessToken returned by /auth/login, prefixed with "Bearer
      ".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
